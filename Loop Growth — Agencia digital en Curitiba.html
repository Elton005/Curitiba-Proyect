function mountJpg(el,filename,{mobile="",alt="",width=800,height=800,priority=false,sizes="(min-width:1024px) 280px, 90vw"}={}){
  const picture=document.createElement("picture");picture.className="asset-picture";

  img.addEventListener("load",()=>{img.classList.add("loaded");el.classList.add("has-image")},{once:true});
  img.addEventListener("error",()=>{const source=picture.querySelector("source");if(source){source.remove();img.src=IMG_DIR+filename;return}el.dataset.missing=filename;el.classList.remove("has-image");picture.remove()});
  picture.append(img);el.prepend(picture);
}
