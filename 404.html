<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060b1a">
<title>404 — Loop Growth</title>
<style>
:root{color-scheme:dark;--bg:#060b1a;--fg:#eef2fb;--mut:#b9c4de;--mint:#19e3a0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}
main{width:min(760px,100%);text-align:center}
.illustration{aspect-ratio:16/9;min-height:220px;border-radius:24px;display:grid;place-items:center;margin:0 auto 30px;overflow:hidden;background:linear-gradient(145deg,#14213b,#0c513f);position:relative}
.illustration:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 38%,rgba(25,227,160,.08));pointer-events:none}
.missing{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-size:clamp(70px,20vw,160px);font-weight:800;letter-spacing:-.08em;position:relative}
.missing img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
h1{font-size:clamp(34px,7vw,60px);line-height:1.05;margin:0 0 12px}
p{color:var(--mut);margin:0 auto 26px;max-width:500px}
a{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--mint);color:#06101f;font-weight:800;text-decoration:none}
a:focus-visible{outline:3px solid #fff;outline-offset:4px}
</style>
</head>
<body>
<main>
<div class="illustration"><div class="missing" role="img" data-missing="404.jpg" data-alt-es="Ilustración de error 404" data-alt-pt="Ilustração de erro 404" aria-label="Ilustración de error 404"><span>404</span></div></div>
<h1 id="title">Esta página no está aquí.</h1>
<p id="description">El enlace pudo cambiar o escribirse de otra forma. Vuelve al inicio para seguir explorando.</p>
<a id="home" href="/">Volver al inicio</a>
</main>
<script>
const isPortuguese=(navigator.language||"").toLowerCase().startsWith("pt");
document.documentElement.lang=isPortuguese?"pt":"es";
const illustration=document.querySelector("[data-missing]");
illustration.setAttribute("aria-label",isPortuguese?"Ilustração de erro 404":"Ilustración de error 404");
const img=document.createElement("img");img.src="assets/img/404.jpg";img.alt="";img.width=1280;img.height=720;img.loading="eager";img.decoding="async";
img.addEventListener("load",()=>illustration.querySelector("span").hidden=true,{once:true});
img.addEventListener("error",()=>img.remove(),{once:true});illustration.prepend(img);
if(isPortuguese){document.title="404 — Loop Growth";document.getElementById("title").textContent="Esta página não está aqui.";document.getElementById("description").textContent="O link pode ter mudado ou sido digitado de outra forma. Volte ao início para continuar explorando.";document.getElementById("home").textContent="Voltar ao início"}
</script>
</body>
</html>
